<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <title>RUH by Ruhi — Handmade Indian Heritage Jewellery</title>
    <meta name="description" content="Shop handcrafted rings and earrings rooted in Gond tribal artistry. RUH by Ruhi — where Indian heritage meets modern wear." />
    <meta property="og:title" content="RUH by Ruhi — Handmade Indian Heritage Jewellery" />
    <meta property="og:description" content="Shop handcrafted rings and earrings rooted in Gond tribal artistry." />
    <meta property="og:type" content="website" />
    <style>
      /* Splash loader — visible until React mounts and removes #ruh-splash */
      #ruh-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: hsl(37 45% 93%);
        color: hsl(158 62% 15%);
        font-family: 'Playfair Display', Georgia, serif;
        transition: opacity 400ms ease;
      }
      #ruh-splash.ruh-splash-hide { opacity: 0; pointer-events: none; }
      #ruh-splash .ruh-splash-mark {
        font-style: italic;
        font-size: 2.25rem;
        letter-spacing: 0.04em;
      }
      #ruh-splash .ruh-splash-tagline {
        font-family: 'Jost', system-ui, sans-serif;
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: hsl(25 76% 31%);
      }
      #ruh-splash .ruh-splash-bar {
        width: 120px;
        height: 1px;
        background: hsl(36 24% 82%);
        overflow: hidden;
        position: relative;
      }
      #ruh-splash .ruh-splash-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: hsl(46 53% 54%);
        animation: ruh-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes ruh-splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="ruh-splash" aria-hidden="true">
      <div class="ruh-splash-mark">RUH</div>
      <div class="ruh-splash-bar"></div>
      <div class="ruh-splash-tagline">Handcrafted Heritage</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
